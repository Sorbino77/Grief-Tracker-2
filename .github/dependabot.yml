version: 2
updates:
  # Python deps via uv (pip-compatible).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      django:
        patterns: ["Django*", "django-*", "djangorestframework*"]
      security-tools:
        patterns: ["bandit", "ruff", "mypy"]

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
