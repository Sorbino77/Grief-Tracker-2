# Fly.io blueprint. Deploy in three commands once you have flyctl installed:
#   fly launch --copy-config --name <YOUR_APP_NAME>
#   fly postgres create --name <YOUR_APP_NAME>-db && fly postgres attach <YOUR_APP_NAME>-db
#   fly deploy
#
# Set secrets that mustn't end up in git:
#   fly secrets set \
#     DJANGO_SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(64))") \
#     DJANGO_SUPERUSER_USERNAME=admin \
#     DJANGO_SUPERUSER_EMAIL=admin@example.com \
#     DJANGO_SUPERUSER_PASSWORD=<a strong 16+ char password>

app = "shiptrack"
primary_region = "ams"   # Amsterdam — change to your closest region

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "shiptrack.settings"
  DJANGO_DEBUG = "False"
  DJANGO_ALLOWED_HOSTS = ".fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://*.fly.dev"
  DJANGO_SECURE_SSL_REDIRECT = "True"
  DJANGO_SESSION_COOKIE_SECURE = "True"
  DJANGO_CSRF_COOKIE_SECURE = "True"
  DJANGO_SECURE_HSTS_SECONDS = "31536000"
  USE_POSTGRES = "True"
  POSTGRES_SSLMODE = "require"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
